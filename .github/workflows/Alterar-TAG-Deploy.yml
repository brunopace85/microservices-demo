name: Update Image Tag in GitOps Repository

on:
  push:
    branches:
      -  main
    paths:
      - 'src/frontend/**'

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v3
            name: Check out code

          - uses: mr-smithers-excellent/docker-build-push@v7
            name: Build & push Docker image
            with:
              image: brunopace85/online-boutique-frontend
              tags: ${{ github.sha }}
              registry: docker.io
              dockerfile: src/frontend/Dockerfile
              directory: src/frontend
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

    update-image-tag:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout manifest repo
            uses: actions/checkout@v3
            with:
              repository: 'brunopace85/microservices-demo-manifests'
              token: ${{ secrets.ACCESS_TOKEN }}
              ref: 'main'

          - name: Update Image Tag in YAML
            uses: fjogeleit/yaml-update-action@v0.12.0
            with:
              valueFile: 'prod/frontend.yaml'
              propertyPath: 'image'
              value: 'brunopace85/online-boutique-frontend:${{ github.sha }}'
              commitChange: true
              message: 'Update frontend image tag to ${{ github.sha }}'
              token: ${{ secrets.ACCESS_TOKEN }}
