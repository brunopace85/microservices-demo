name: Update Image Tag in GitOps Repository

on:
  push:
    branches:
      -  main
    paths:
      - 'src/frontend/**'

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v3
            name: Check out code

          - uses: mr-smithers-excellent/docker-build-push@v7
            name: Build & push Docker image
            with:
              image: brunopace85/online-boutique-frontend
              tags: ${{ github.sha }}
              registry: docker.io
              dockerfile: .
              directory: src/frontend
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

    update-image-tag:
        runs-on: ubuntu-latest

        steps:
            - name: "GitOps - Update Image Tag"
              uses: adwert-it/gitops-image-update@v1
              with:
                    REPOSITORY_NAME: 'brunopace85/microservices-demo-manifests'
                    ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
                    BRANCH: "main"
                    VALUES_FILE_PATH: 'prod/frontend.yaml'
                    VALUE_NAME: 'image'
                    TAG: brunopace85\/online-boutique-frontend:${{ github.sha }}
