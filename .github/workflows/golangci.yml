version: "2"

linters:
  settings:
    govet:
      disable:
        # o código do upstream passa genproto.Money por valor
        - copylocks
        # avisos de modernização (ex.: ioutil.ReadAll), não são bugs
        - inline
    staticcheck:
      checks:
        - all
        # padrão do golangci-lint v2
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # estilo e APIs deprecadas do código do upstream
        - -SA1019
        - -ST1005
        - -ST1017
        - -S1002
        - -QF1003
  exclusions:
    rules:
      # retornos de erro ignorados e função sem uso no código do upstream
      - linters:
          - errcheck
          - unused
        path: (handlers|main|packaging_info)\.go$
