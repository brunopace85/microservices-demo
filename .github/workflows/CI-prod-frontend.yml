name: Frontend - Lint, Build & Update GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - '.github/workflows/CI-prod-frontend.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/CI-prod-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Em PR cancela execuções antigas; na main nunca cancela (evita interromper um deploy)
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: brunopace85/online-boutique-frontend
  SERVICE_NAME: frontend

jobs:
  autofix:
    name: gofmt + golangci-lint --fix
    runs-on: ubuntu-latest
    # PRs vindos de forks não têm permissão de escrita
    if: github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Check out code (branch do PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # com o PAT, o commit do autofix dispara os outros workflows de novo
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/frontend/go.mod
          cache-dependency-path: src/frontend/go.sum

      - name: gofmt -w
        run: gofmt -w .

      - name: golangci-lint --fix
        uses: golangci/golangci-lint-action@v8
        # o que não tem correção automática continua sendo barrado no workflow de lint
        continue-on-error: true
        with:
          version: latest
          working-directory: src/frontend
          args: --fix --timeout=5m

      - name: Commit das correções
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A .
            git commit -m "style(frontend): autofix gofmt e golangci-lint"
            git push
          else
            echo "Nada para corrigir."
          fi

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: autofix
    # só publica imagem em push/execução manual, nunca em pull request
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ github.sha }}
          registry: docker.io
          dockerfile: src/${{ env.SERVICE_NAME }}/Dockerfile
          directory: src/${{ env.SERVICE_NAME }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  update-gitops:
    name: Update image tag in GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    env:
      GITOPS_REPO: "brunopace85/microservices-demo-manifests"
      BRANCH: "main"
      VALUE_NAME: "image"
      NEW_TAG: ${{ github.sha }}
      GITOPS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

    steps:
      - name: Update Tag directly in GitOps Repo
        run: |
          # 1. Clona o repositório GitOps
          REPO_URL="https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git"
          git clone --depth 1 ${REPO_URL} --branch ${BRANCH} --single-branch ./gitops-repo
          cd ./gitops-repo

          # 2. Atualiza o valor no arquivo YAML usando sed
          # Usa '|' como delimitador para evitar conflito com as barras da imagem
          sed -i 's|'${VALUE_NAME}': .*$|'${VALUE_NAME}': "'${IMAGE_NAME}:${NEW_TAG}'"|g' "./prod/${{ env.SERVICE_NAME }}.yaml"

          # 3. Configura o Git e envia a alteração
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit --allow-empty -m "Update revision of '${VALUE_NAME}' to ${NEW_TAG}"
          git pull --rebase
          git push
        shell: bash